[package]
name = "cmr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Propagates the storage crate's loopback-only E2E fixture support. Storage also
# requires debug_assertions, so release/all-features builds cannot enable it.
e2e-loopback-upstream = ["cmr-storage/e2e-loopback-upstream"]

[[bin]]
name = "cmr"
path = "src/main.rs"

[[bin]]
name = "cmr-service"
path = "src/service_main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
cmr-providers = { path = "../cmr-providers" }
cmr-router = { path = "../cmr-router" }
cmr-storage = { path = "../cmr-storage" }
directories.workspace = true
local-encoding-ng.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
same-file = "1.0"
tempfile = "3.20"
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
