[workspace]
resolver = "2"
members = [
  "crates/cmr-core",
  "crates/cmr-providers",
  "crates/cmr-storage",
  "crates/cmr-router",
  "crates/cmr-cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/YOUR_USERNAME/modelrelay"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "json", "macros", "ws"] }
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
futures-util = "0.3"
eventsource-stream = "0.2"
http = "1.3"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
local-encoding-ng = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.37"
thiserror = "2.0"
tokio = { version = "1.46", features = ["full"] }
tokio-stream = "0.1"
toml = "0.9"
toml_edit = "0.23"
rpassword = "7.4"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.17", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
